# Cross-compilation linker configuration for Nexus edge targets.
#
# Install cross-linkers first:
#   macOS:  brew install FiloSottile/musl-cross/musl-cross
#   Ubuntu: sudo apt install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf musl-tools

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

# Shared build settings
[build]
rustflags = ["-C", "target-cpu=native"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
