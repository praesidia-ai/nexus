[package]
name = "nexus-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Criterion benchmark suite for Nexus hot paths"

license.workspace = true
repository.workspace = true
[dependencies]
nexus-store = { path = "../nexus-store" }
nexus-memory = { path = "../nexus-memory" }
nexus-kernel = { path = "../nexus-kernel" }
nexus-mcp = { path = "../nexus-mcp" }
nexus-a2a = { path = "../nexus-a2a" }
nexus-agents-core = { path = "../nexus-agents-core" }
nexus-eval = { path = "../nexus-eval" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = { workspace = true }
tempfile = "3"

[[bin]]
name = "nexus-token-bench"
path = "src/bin/token_bench_main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "kernel_bench"
harness = false

[[bench]]
name = "tool_dispatch_bench"
harness = false

[[bench]]
name = "cold_start_bench"
harness = false
